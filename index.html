<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mosógép</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f2f2f7;
            color: #111;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .item {
            background: white;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        button {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: #007aff;
            color: white;

            font-size: 25px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.92);
        }

        .count {
            width: 30px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
        }

        .summary {
            background: #111;
            color: white;

            margin-top: 25px;
            padding: 20px;

            border-radius: 20px;
        }

        .summary-title {
            font-size: 14px;
            color: #aaa;
        }

        .summary-number {
            font-size: 36px;
            font-weight: bold;
            margin-top: 4px;
        }

        .reset {
            width: 100%;
            height: 50px;

            margin-top: 15px;

            border-radius: 14px;
            background: #e5e5ea;
            color: #ff3b30;

            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>🧺 Mosógép</h1>
        <p class="subtitle">Mi van jelenleg a mosógépben?</p>

        <div id="lista"></div>

        <div class="summary">
            <div class="summary-title">Összes ruhadarab</div>
            <div class="summary-number" id="total">0</div>
        </div>

        <button class="reset" onclick="reset()">Mosógép kiürítése</button>

    </div>


    <script>

        const ruhak = [
            "Pulcsi",
            "Póló",
            "Nadrág",
            "Zokni",
            "Alsónadrág"
        ];

        let darabok = JSON.parse(localStorage.getItem("mosogep")) || {};

        // Ha valamelyik ruha még nincs elmentve, legyen 0.
        ruhak.forEach(ruha => {
            if (darabok[ruha] === undefined) {
                darabok[ruha] = 0;
            }
        });


        function megjelenit() {

            const lista = document.getElementById("lista");

            lista.innerHTML = "";

            ruhak.forEach(ruha => {

                const item = document.createElement("div");
                item.className = "item";

                item.innerHTML = `
                <div class="item-name">${ruha}</div>

                <div class="controls">
                    <button onclick="modosit('${ruha}', -1)">−</button>

                    <div class="count">
                        ${darabok[ruha]}
                    </div>

                    <button onclick="modosit('${ruha}', 1)">+</button>
                </div>
            `;

                lista.appendChild(item);
            });

            osszesites();
        }


        function modosit(ruha, mennyiseg) {

            darabok[ruha] += mennyiseg;

            // Ne lehessen negatív.
            if (darabok[ruha] < 0) {
                darabok[ruha] = 0;
            }

            mentes();
            megjelenit();
        }


        function osszesites() {

            let osszes = 0;

            ruhak.forEach(ruha => {
                osszes += darabok[ruha];
            });

            document.getElementById("total").textContent = osszes;
        }


        function mentes() {
            localStorage.setItem("mosogep", JSON.stringify(darabok));
        }


        function reset() {

            ruhak.forEach(ruha => {
                darabok[ruha] = 0;
            });

            mentes();
            megjelenit();
        }


        megjelenit();

    </script>

</body>

</html>
